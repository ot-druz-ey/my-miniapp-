<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1c1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 20px; margin-bottom: 6px; }
    p { color: #8e8e93; font-size: 14px; margin-bottom: 20px; text-align: center; }
    textarea {
      width: 90%;
      max-width: 320px;
      height: 80px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: white;
      font-size: 16px;
      resize: none;
      outline: none;
      margin-bottom: 12px;
    }
    button {
      width: 90%;
      max-width: 320px;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    .result {
      margin-top: 20px;
      width: 90%;
      max-width: 320px;
    }
    img {
      width: 100%;
      border-radius: 12px;
      display: none;
    }
    .status {
      color: #8e8e93;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>AI Generator</h1>
  <p>Реалистичные картинки в один клик</p>

  <textarea id="prompt" placeholder="Опиши что нарисовать..."></textarea>
  <button id="btn" onclick="go()">Сгенерировать</button>

  <div class="result">
    <div id="status" class="status">Генерируем картинку...</div>
    <img id="resImg" alt="Result">
  </div>

  <script>
    function go() {
      const text = document.getElementById('prompt').value.trim();
      if (!text) return;

      const btn = document.getElementById('btn');
      const img = document.getElementById('resImg');
      const status = document.getElementById('status');

      btn.disabled = true;
      btn.innerText = 'Создаем...';
      img.style.display = 'none';
      status.style.display = 'block';

      // Добавляем теги для крутого качества
      const query = encodeURIComponent(text + ", photorealistic, highly detailed, 8k");
      
      // Используем стабильный эндпоинт
      img.src = `https://image.pollinations.ai/prompt/${query}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;

      img.onload = function() {
        status.style.display = 'none';
        img.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Сгенерировать';
      };

      img.onerror = function() {
        status.style.display = 'none';
        btn.disabled = false;
        btn.innerText = 'Сгенерировать';
        alert('Сервер перегружен, нажми еще раз!');
      };
    }
  </script>

</body>
</html>
