<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Studio</title>
  <style>
    :root {
      --bg-color: #0f0f11;
      --card-bg: #1c1c1e;
      --accent: #0a84ff;
      --accent-hover: #0070e0;
      --text-main: #ffffff;
      --text-secondary: #8e8e93;
      --border: #3a3a3c;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .input-group {
      width: 100%;
      position: relative;
      margin-bottom: 12px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 16px;
      font-family: inherit;
      resize: none;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background-color: var(--accent);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:active {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result-card {
      margin-top: 24px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .image-wrapper {
      width: 100%;
      aspect-ratio: 1/1;
      position: relative;
      background-color: #141416;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AI Studio</h1>
    <p>Создавай фотореалистичные изображения без мультяшности</p>

    <div class="input-group">
      <textarea id="prompt" placeholder="Опиши кадр (например: роскошный дубайский шоколад с фисташками...)"></textarea>
    </div>
    
    <button id="btn" onclick="generateImage()">Сгенерировать шедевр</button>

    <div class="result-card" id="resultCard">
      <div class="image-wrapper">
        <div class="loader" id="loader">
          <div class="spinner"></div>
          <span id="loadingText">Создаем фото...</span>
        </div>
        <img id="resImg" alt="Generated Image" onload="imageLoaded()" onerror="imageError()">
      </div>
    </div>
  </div>

  <script>
    async function generateImage() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('btn');
      const card = document.getElementById('resultCard');
      const img = document.getElementById('resImg');
      const loader = document.getElementById('loader');
      const loadingText = document.getElementById('loadingText');

      const text = input.value.trim();
      if (!text) return;

      // Блокируем интерфейс и показываем карточку результата с загрузкой
      btn.disabled = true;
      btn.innerText = 'Генерация...';
      card.style.display = 'block';
      img.style.display = 'none';
      loader.style.display = 'flex';
      loadingText.innerText = 'Нейросеть рисует детали...';

      // Профессиональный промпт-инжиниринг: принудительно убираем мультяшность, добавляем 8k и фотореализм
      const enhancedPrompt = `${text}, photorealistic, highly detailed, 8k resolution, cinematic lighting, sharp focus, professional photography, masterpiece`;
      
      // Рандомный сид и таймстамп гарантируют, что картинка всегда будет уникальной и не застрянет в кэше
      const seed = Math.floor(Math.random() * 1000000);
      const imageUrl = `https://pollinations.ai/prompt/${encodeURIComponent(enhancedPrompt)}?width=1024&height=1024&seed=${seed}&nologo=true`;

      // Предзагрузка изображения через объект Image, чтобы отловить точную готовность
      const imageLoader = new Image();
      imageLoader.src = imageUrl;

      imageLoader.onload = function() {
        img.src = imageUrl;
        img.style.display = 'block';
        loader.style.display = 'none';
        btn.disabled = false;
        btn.innerText = 'Сгенерировать шедевр';
      };

      imageLoader.onerror = function() {
        loader.style.display = 'none';
        btn.disabled = false;
        btn.innerText = 'Сгенерировать шедевр';
        alert('Не удалось загрузить изображение. Попробуйте еще раз.');
      };
    }
  </script>

</body>
</html>
