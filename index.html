<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Картинок</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1c1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 20px; margin-bottom: 4px; text-align: center; }
    p { color: #8e8e93; font-size: 14px; margin-bottom: 16px; text-align: center; }
    
    input {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
      outline: none;
    }
    
    button {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }

    .result {
      margin-top: 20px;
      width: 90%;
      max-width: 320px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
    }
    img {
      width: 100%;
      border-radius: 12px;
      display: none;
    }
    .status {
      color: #8e8e93;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Генератор Картин</h1>
  <p>Опиши картинку, и нейросеть нарисует её</p>

  <input type="text" id="prompt" placeholder="например: белая спортивная машина..." onkeydown="if(event.key==='Enter') generate()">
  <button id="btn" onclick="generate()">Сгенерировать</button>

  <div class="result">
    <div id="status" class="status">Переводим и рисуем...</div>
    <img id="resImg" alt="Result" onload="imageLoaded()" onerror="imageError()">
  </div>

  <script>
    async function generate() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('btn');
      const img = document.getElementById('resImg');
      const status = document.getElementById('status');
      
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      img.style.display = 'none';
      status.style.display = 'block';
      status.innerText = 'Переводим запрос...';

      let finalPrompt = text;

      try {
        // Быстро переводим через бесплатный публичный переводчик, чтобы нейросеть точно поняла суть
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        if (data && data[0] && data[0][0] && data[0][0][0]) {
          finalPrompt = data[0].map(item => item[0]).join('');
        }
      } catch (e) {
        // Если переводчик не ответил, шлем оригинал
        finalPrompt = text;
      }

      status.innerText = 'Нейросеть рисует...';

      // Собираем ссылку на генерацию картинки
      const encodedPrompt = encodeURIComponent(finalPrompt);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?n=${Date.now()}`;

      img.src = imageUrl;
    }

    function imageLoaded() {
      const btn = document.getElementById('btn');
      const img = document.getElementById('resImg');
      const status = document.getElementById('status');
      
      status.style.display = 'none';
      img.style.display = 'block';
      btn.disabled = false;
      btn.innerText = 'Сгенерировать';
    }

    function imageError() {
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      
      status.style.display = 'none';
      alert('Не удалось загрузить картинку, попробуй еще раз');
      btn.disabled = false;
      btn.innerText = 'Сгенерировать';
    }
  </script>

</body>
</html>
