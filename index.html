<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Генератор Аватарок</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1c1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #8e8e93; font-size: 14px; margin-bottom: 16px; text-align: center; }
    
    input {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    
    button {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }

    .result {
      margin-top: 20px;
      width: 90%;
      max-width: 320px;
      display: flex;
      justify-content: center;
    }
    img {
      width: 100%;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>AI Генератор Аватарок</h1>
  <p>Опиши картинку на английском</p>

  <input type="text" id="prompt" placeholder="cool neon cat...">
  <button id="btn" onclick="generate()">Сгенерировать</button>

  <div class="result">
    <img id="resImg" alt="Result">
  </div>

  <script>
    let timer = null;

    function generate() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('btn');
      const img = document.getElementById('resImg');
      
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Рисую...';

      if (timer) clearTimeout(timer);

      const seed = Math.floor(Math.random() * 9999999);
      const encoded = encodeURIComponent(text);
      
      const fluxUrl = 'https://image.pollinations.ai/prompt/' + encoded + '?seed=' + seed + '&model=flux&nologo=true&t=' + Date.now();
      const turboUrl = 'https://image.pollinations.ai/prompt/' + encoded + '?seed=' + seed + '&model=turbo&nologo=true&t=' + Date.now();

      const tempImg = new Image();
      let hasLoaded = false;

      // 1. Пробуем загрузить через Flux
      tempImg.src = fluxUrl;

      // 2. Если Flux не ответил за 5 секунд, принудительно качаем через быстрый Turbo
      timer = setTimeout(() => {
        if (!hasLoaded) {
          btn.innerText = 'Ускоряю...';
          tempImg.src = turboUrl;
        }
      }, 5000);

      tempImg.onload = () => {
        hasLoaded = true;
        clearTimeout(timer);
        img.src = tempImg.src;
        img.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Сгенерировать';
      };

      tempImg.onerror = () => {
        if (tempImg.src !== turboUrl) {
          // Если Flux упал с ошибкой, сразу переключаем на Turbo
          tempImg.src = turboUrl;
        } else {
          hasLoaded = true;
          clearTimeout(timer);
          alert('Сервер временно перегружен, нажми ещё раз!');
          btn.disabled = false;
          btn.innerText = 'Сгенерировать';
        }
      };
    }
  </script>

</body>
</html>
