<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Генератор Аватарок</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1c1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }
    p {
      color: #8e8e93;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }
    input {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    button {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
    }
    .result {
      margin-top: 20px;
      width: 90%;
      max-width: 320px;
      display: flex;
      justify-content: center;
    }
    img {
      width: 100%;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>AI Генератор Аватарок</h1>
  <p>Опиши картинку на английском</p>

  <input type="text" id="prompt" placeholder="cool neon cat...">
  <button id="btn" onclick="generate()">Сгенерировать</button>

  <div class="result">
    <img id="resImg" alt="Result">
  </div>

  <script>
    function generate() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('btn');
      const img = document.getElementById('resImg');
      
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Генерирую...';

      // Генерируем уникальный seed и timestamp для отмены кэширования
      const seed = Math.floor(Math.random() * 9999999);
      const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(text) + '?seed=' + seed + '&t=' + Date.now();

      // Загружаем новую картинку в память перед показoм
      const tempImg = new Image();
      tempImg.src = url;

      tempImg.onload = () => {
        img.src = url;
        img.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Сгенерировать';
      };

      tempImg.onerror = () => {
        alert('Сервер перегружен, попробуй ещё раз!');
        btn.disabled = false;
        btn.innerText = 'Сгенерировать';
      };
    }
  </script>

</body>
</html>
