<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Картин</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1c1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 20px; margin-bottom: 4px; text-align: center; }
    p { color: #8e8e93; font-size: 14px; margin-bottom: 16px; text-align: center; }
    
    textarea {
      width: 90%;
      max-width: 320px;
      height: 70px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
      outline: none;
      resize: none;
    }
    
    button {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }

    .result {
      margin-top: 20px;
      width: 90%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img {
      width: 100%;
      border-radius: 12px;
      display: none;
    }
    .status {
      color: #8e8e93;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>Генератор Картин</h1>
  <p>Опиши кадр, и нейросеть нарисует</p>

  <textarea id="prompt" placeholder="например: кристально чистая вода в стеклянной бутылке..."></textarea>
  <button id="btn" onclick="generate()">Сгенерировать</button>

  <div class="result">
    <div id="status" class="status">Нейросеть рисует...</div>
    <img id="resImg" alt="Result">
  </div>

  <script>
    function generate() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('btn');
      const img = document.getElementById('resImg');
      const status = document.getElementById('status');
      
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Рисуем...';
      img.style.display = 'none';
      status.style.display = 'block';

      // Используем стабильный прямой путь без лишних падений
      const enhancedPrompt = `${text}, photorealistic, highly detailed, 8k`;
      const imageUrl = `https://pollinations.ai/p/${encodeURIComponent(enhancedPrompt)}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;

      img.src = imageUrl;

      img.onload = function() {
        status.style.display = 'none';
        img.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Сгенерировать';
      };

      img.onerror = function() {
        status.style.display = 'none';
        // Если вдруг моргнуло, даем второй шанс без алерта, просто возвращаем кнопку
        btn.disabled = false;
        btn.innerText = 'Сгенерировать';
      };
    }
  </script>

</body>
</html>
