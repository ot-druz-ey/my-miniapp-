<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DALL-E 3 Генератор</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1c1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #8e8e93; font-size: 14px; margin-bottom: 16px; text-align: center; }
    
    input {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    
    button {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }

    .result {
      margin-top: 20px;
      width: 90%;
      max-width: 320px;
      display: flex;
      justify-content: center;
    }
    img {
      width: 100%;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>DALL-E 3 Генератор</h1>
  <p>Опиши картинку на любом языке</p>

  <input type="text" id="prompt" placeholder="например: дубайский шоколад...">
  <button id="btn" onclick="generate()">Сгенерировать</button>

  <div class="result">
    <img id="resImg" alt="Result">
  </div>

  <script>
    const OPENAI_API_KEY = "sk-proj-7g0n4cdUUTsIr_rhV693k";

    async function generate() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('btn');
      const img = document.getElementById('resImg');
      
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'DALL-E 3 рисует...';
      img.style.display = 'none';

      try {
        const response = await fetch('https://api.openai.com/v1/images/generations', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: 'dall-e-3',
            prompt: text,
            n: 1,
            size: '1024x1024'
          })
        });

        const data = await response.json();

        if (response.ok && data.data && data.data[0].url) {
          img.src = data.data[0].url;
          img.style.display = 'block';
        } else {
          alert('Ошибка: ' + (data.error?.message || 'Не удалось сгенерировать'));
        }
      } catch (err) {
        alert('Ошибка сети: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Сгенерировать';
      }
    }
  </script>

</body>
</html>
