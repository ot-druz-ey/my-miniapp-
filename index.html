<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Генератор Аватарок</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1c1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #8e8e93; font-size: 14px; margin-bottom: 16px; text-align: center; }
    
    input, select {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }
    
    button {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }

    .result {
      margin-top: 20px;
      width: 90%;
      max-width: 320px;
      display: flex;
      justify-content: center;
    }
    img {
      width: 100%;
      border-radius: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <h1>AI Генератор Аватарок</h1>
  <p>Опиши картинку на русском или английском</p>

  <input type="text" id="prompt" placeholder="например: дубайский шоколад...">

  <select id="styleSelect">
    <option value="photo">📷 Реалистичное фото</option>
    <option value="digital">🎨 Цифровой арт</option>
    <option value="3d">🧊 3D Рендер</option>
    <option value="anime">✨ Аниме / Манга</option>
  </select>

  <button id="btn" onclick="generate()">Сгенерировать</button>

  <div class="result">
    <img id="resImg" alt="Result">
  </div>

  <script>
    let timer = null;

    function generate() {
      const input = document.getElementById('prompt');
      const styleSelect = document.getElementById('styleSelect');
      const btn = document.getElementById('btn');
      const img = document.getElementById('resImg');
      
      let text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.innerText = 'Оптимизирую и рисую...';

      if (timer) clearTimeout(timer);

      // Добавляем автоматическое улучшение промпта под выбранный стиль
      let stylePrefix = '';
      const style = styleSelect.value;

      if (style === 'photo') {
        stylePrefix = 'high quality professional studio photograph, detailed object closeup, 8k resolution, cinematic lighting, ultra realistic, ';
      } else if (style === 'digital') {
        stylePrefix = 'digital artwork, trending on artstation, highly detailed, vibrant colors, masterpiece, ';
      } else if (style === '3d') {
        stylePrefix = '3d render, octane render, smooth surfaces, volumetric light, highly detailed 3d object, ';
      } else if (style === 'anime') {
        stylePrefix = 'beautiful anime illustration, highly detailed, makoto shinkai style, vibrant lighting, ';
      }

      // Формируем прокачанный запрос
      const enhancedPrompt = stylePrefix + text + ', clean background, masterpiece, best quality';

      const seed = Math.floor(Math.random() * 9999999);
      const encoded = encodeURIComponent(enhancedPrompt);
      
      const fluxUrl = 'https://image.pollinations.ai/prompt/' + encoded + '?seed=' + seed + '&model=flux&nologo=true&t=' + Date.now();
      const turboUrl = 'https://image.pollinations.ai/prompt/' + encoded + '?seed=' + seed + '&model=turbo&nologo=true&t=' + Date.now();

      const tempImg = new Image();
      let hasLoaded = false;

      tempImg.src = fluxUrl;

      // Резервный таймер на 6 секунд
      timer = setTimeout(() => {
        if (!hasLoaded) {
          btn.innerText = 'Ускоряю...';
          tempImg.src = turboUrl;
        }
      }, 6000);

      tempImg.onload = () => {
        hasLoaded = true;
        clearTimeout(timer);
        img.src = tempImg.src;
        img.style.display = 'block';
        btn.disabled = false;
        btn.innerText = 'Сгенерировать';
      };

      tempImg.onerror = () => {
        if (tempImg.src !== turboUrl) {
          tempImg.src = turboUrl;
        } else {
          hasLoaded = true;
          clearTimeout(timer);
          alert('Сервер временно перегружен, нажми ещё раз!');
          btn.disabled = false;
          btn.innerText = 'Сгенерировать';
        }
      };
    }
  </script>

</body>
</html>
