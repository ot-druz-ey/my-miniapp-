    <script>
    function generate() {
      let text = document.getElementById('prompt').value.trim();
      if (!text) {
        alert('Введи текст запроса!');
        return;
      }

      const img = document.getElementById('resImg');
      const status = document.getElementById('status');
      
      status.style.display = 'block';
      status.innerText = 'Генерация началась...';
      img.style.display = 'none';

      // Жестко задаем порядок полос, чтобы модель не путалась
      const lower = text.toLowerCase();
      if (lower.includes('russia') || lower.includes('росси')) {
        text = 'a realistic flag of Russia on a flagpole, exactly three horizontal stripes in strict order: top stripe is white, middle stripe is blue, bottom stripe is red';
      } else if (lower.includes('germany') || lower.includes('герман')) {
        text = 'a realistic flag of Germany on a flagpole, exactly three horizontal stripes in strict order: top stripe is black, middle stripe is red, bottom stripe is gold-yellow';
      } else if (lower.includes('france') || lower.includes('франц')) {
        text = 'a realistic flag of France on a flagpole, exactly three vertical stripes in strict order: left stripe is blue, middle stripe is white, right stripe is red';
    }

      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1024&model=flux&nologo=true&t=${Date.now()}`;
      
      img.src = url;
      
      img.onload = function() {
        status.style.display = 'none';
        img.style.display = 'block';
      };

      img.onerror = function() {
        status.innerText = 'Ошибка загрузки, попробуй еще раз';
      };
    }
  </script>
