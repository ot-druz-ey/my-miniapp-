<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ Помощник</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1c1e;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 { font-size: 18px; text-align: center; margin-bottom: 12px; }
    
    #chat {
      flex: 1;
      overflow-y: auto;
      background-color: #2c2c2e;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .message {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 80%;
      word-break: break-word;
      font-size: 15px;
    }
    .user { background-color: #007aff; align-self: flex-end; }
    .ai { background-color: #3a3a3c; align-self: flex-start; }

    .input-box {
      display: flex;
      gap: 8px;
    }
    
    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: white;
      font-size: 16px;
      outline: none;
    }
    
    button {
      padding: 0 16px;
      border-radius: 10px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>

  <h1>ИИ Чат-помощник</h1>

  <div id="chat">
    <div class="message ai">Привет! Спроси меня о чём угодно.</div>
  </div>

  <div class="input-box">
    <input type="text" id="prompt" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') send()">
    <button id="btn" onclick="send()">Отправить</button>
  </div>

  <script>
    const OPENAI_API_KEY = "sk-proj-7g0n4cdUUTsIr_rhV693k";

    async function send() {
      const input = document.getElementById('prompt');
      const btn = document.getElementById('btn');
      const chat = document.getElementById('chat');
      
      const text = input.value.trim();
      if (!text) return;

      // Добавляем сообщение пользователя в чат
      chat.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      btn.disabled = true;

      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [{ role: 'user', content: text }]
          })
        });

        const data = await response.json();

        if (response.ok && data.choices && data.choices[0]) {
          const reply = data.choices[0].message.content;
          chat.innerHTML += `<div class="message ai">${escapeHtml(reply)}</div>`;
        } else {
          chat.innerHTML += `<div class="message ai" style="color:#ff453a;">Ошибка: ${escapeHtml(data.error?.message || 'Не удалось получить ответ')}</div>`;
        }
      } catch (err) {
        chat.innerHTML += `<div class="message ai" style="color:#ff453a;">Ошибка сети: ${escapeHtml(err.message)}</div>`;
      } finally {
        btn.disabled = false;
        chat.scrollTop = chat.scrollHeight;
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>

</body>
</html>
