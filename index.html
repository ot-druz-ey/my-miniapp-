<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Картин</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #1c1c1e;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { font-size: 20px; margin-bottom: 4px; text-align: center; }
    p { color: #8e8e93; font-size: 14px; margin-bottom: 16px; text-align: center; }
    
    textarea {
      width: 90%;
      max-width: 320px;
      height: 70px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
      box-sizing: border-box;
      outline: none;
      resize: none;
    }
    
    button {
      width: 90%;
      max-width: 320px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background-color: #007aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      width: 90%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    img {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }
    .status {
      color: #8e8e93;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Генератор Картин</h1>
  <p>Опиши кадр, и нажми кнопку</p>

  <textarea id="prompt" placeholder="например: flag Russia..."></textarea>
  <button onclick="generate()">Сгенерировать</button>

  <div class="result">
    <div id="status" class="status" style="display: none;">Загрузка...</div>
    <img id="resImg" alt="" style="display: none;">
  </div>

  <script>
    function generate() {
      const text = document.getElementById('prompt').value.trim();
      if (!text) {
        alert('Введи текст запроса!');
        return;
      }

      const img = document.getElementById('resImg');
      const status = document.getElementById('status');
      
      status.style.display = 'block';
      status.innerText = 'Генерация началась...';
      img.style.display = 'none';

      // Умный промпт: если просят флаг или символ, заставляем нейросеть делать четкий акцент на объекте
      let smartPrompt = text;
      if (text.toLowerCase().includes('flag') || text.toLowerCase().includes('флаг')) {
        smartPrompt = `clear official ${text}, sharp geometry, fluttering fabric, isolated on clean background or realistic setting`;
      } else {
        smartPrompt = `${text}, high quality, crisp details, sharp focus`;
      }

      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(smartPrompt)}?width=1024&height=1024&nologo=true&t=${Date.now()}`;
      
      img.src = url;
      
      img.onload = function() {
        status.style.display = 'none';
        img.style.display = 'block';
      };

      img.onerror = function() {
        status.innerText = 'Ошибка загрузки, попробуй еще раз';
      };
    }
  </script>

</body>
</html>
